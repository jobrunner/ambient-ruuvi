name: ambient-ruuvi
options:
  bundleIdPrefix: io.brunner
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: "5.0"
targets:
  ambient-ruuvi:
    type: application
    platform: iOS
    sources:
      - path: ambient-ruuvi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.brunner.ambient-ruuvi
        DEVELOPMENT_TEAM: XS554Q5YY9
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Zum Auslesen der RuuviTag-Sensordaten per Bluetooth."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    scheme:
      testTargets:
        - ambient-ruuviTests
  ambient-ruuviTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ambient-ruuviTests
    dependencies:
      - target: ambient-ruuvi
